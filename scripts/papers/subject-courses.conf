# 各学科「考试汇总」课程登记表 —— 试卷编号的来源
# 格式: 站点别名|学科|subjectId|courseId|课程名
#
# 用途: 给考试学科「关联已有试卷」时，试卷编号来自这些课程里按考试建的章节。
#       一个章节 = 一场考试，章节内容里的 `#编号 满分N分 M道题` 即该场该科的试卷编号。
#
# 怎么找到这些值:
#   subjectId —— localStorage['grade_subjects']（本站课程体系用 grade=2 那套）
#   courseId  —— 打开 /course?schoolSubject=<subjectId>，点开 `2024级<学科>考试汇总` 拿 URL 里的 /course/<id>
#   详见 references/bind-papers-workflow.md
#
# ⚠️ 课程 id 是**站点级**的，换学校/换站点要重新登记（同一学校不会变）。
# ⚠️ 英语特殊：该学科下有多门（2026级/2025级/2024级考试汇总），必须选 `2024级英语考试汇总`。

